services:
    pocketbase:
        build:
            context: ./pocketbase
            dockerfile: Dockerfile
        ports:
            - '8090:8090'
        volumes:
            # Mount a host directory to persist PocketBase data and storage.
            # Without this, all data is lost when the container is removed.
            # - ./pocketbase/pb_data:/app/pb_data
            - ./pocketbase/pb_hooks:/app/pb_hooks
        environment:
            - PB_SECRET=${PB_SECRET:-$(openssl rand -hex 32)}
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8090/api/health']
            interval: 15s
            timeout: 5s
            retries: 3

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - '3000:80'
        depends_on:
            - pocketbase
        restart: unless-stopped

networks:
    default:
        name: stjorna-network
