---
# STJÓRNA — ESLint configuration for the SolidJS frontend.
#
# This file is consumed by Codacy when its ESLint tool is set to
# "Configuration file" mode in the Code patterns page (one-time UI
# toggle per repo). See:
#   https://docs.codacy.com/repositories-configure/configuring-code-patterns/
#
# Why we need it: Codacy's stock ESLint config applies eslint-plugin-react
# to every .tsx file. STJÓRNA's frontend is SolidJS — React's
# `react-in-jsx-scope` and `no-unknown-property` rules fire on every
# SolidJS JSX line because SolidJS doesn't import React and uses
# `class` instead of `className`. The same goes for eslint-plugin-i18next
# (we have no i18n wired up; tracked in #183) and eslint-plugin-compat
# (we target modern evergreen browsers only).

root: true

rules:
  # React rules are false positives for SolidJS:
  #   - SolidJS JSX doesn't require `import React from 'react'`
  #   - SolidJS uses `class`, not `className`
  react/react-in-jsx-scope: off
  react/no-unknown-property: off

  # i18next: STJÓRNA has no i18n wired up yet — tracked in #183.
  # When i18n lands, this rule comes back as a real check.
  i18next/no-literal-string: off

  # compat: STJÓRNA targets modern evergreen browsers only.
  compat/compat: off

ignorePatterns:
  - dist/
  - node_modules/
  - public/
  - playwright-report/
  - test-results/
  # Version stamp is build-time generated; see scripts/generate-version.mjs.
  - "*.generated.ts"
