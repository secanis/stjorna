# STJÓRNA — Codacy analysis configuration.
#
# STJÓRNA's frontend is SolidJS, not React. ESLint rule suppression lives
# in frontend/.eslintrc.yml (Codacy honors it when its ESLint tool is
# set to "Configuration file" mode in the Code patterns page — see
# https://docs.codacy.com/repositories-configure/configuring-code-patterns/).
#
# This file (.codacy.yml) only configures tools whose rules .codacy.yml
# can actually control: file-level exclusions for markdownlint and PMD.
# ESLint pattern suppression via .codacy.yml is not supported (the docs
# note "you can't enable or disable them" — patterns must be disabled via
# .eslintrc.* + the Configuration-file toggle, or via the codacy UI/API
# directly).
---
engines:
  markdownlint:
    patterns:
      # API_KEYS_REPORT.md is a design doc with long prose on purpose.
      # Breaking it at the 80-char mark would hurt readability.
      - id: MD013
        paths:
          - API_KEYS_REPORT.md
  PMD:
    patterns:
      # PocketBase migrations use empty `catch` blocks for idempotent
      # rollbacks (best-effort, comment only).
      - id: category/ecmascript/codestyle/UnnecessaryBlock
        paths:
          - pocketbase/pb_migrations/
