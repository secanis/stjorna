{{- /*
NetworkPolicies (values: networkPolicy.*). Only ingress is restricted:
  - PocketBase: reachable on its HTTP port only from the frontend pods
    (nginx proxies /api/ and realtime) plus networkPolicy.pocketbase.extraFrom.
  - Frontend: reachable on its HTTP port from anywhere, because the
    ingress controller's namespace / labels differ per cluster.
Egress stays open (S3, SMTP, OIDC providers, DNS).
Inert unless the cluster's CNI enforces NetworkPolicies.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stjorna.pocketbase.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
spec:
  podSelector:
    matchLabels:
      {{- include "stjorna.pocketbase.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "stjorna.frontend.selectorLabels" . | nindent 14 }}
        # `helm test` pod (templates/tests/test-connection.yaml).
        - podSelector:
            matchLabels:
              {{- include "stjorna.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: helm-test
        {{- with .Values.networkPolicy.pocketbase.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "stjorna.frontend.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      {{- include "stjorna.frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
{{- end }}
