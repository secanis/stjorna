apiVersion: v1
kind: Service
metadata:
  name: {{ include "stjorna.frontend.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "stjorna.frontend.selectorLabels" . | nindent 4 }}
