{{- /*
ServiceAccount is a placeholder for now (no RBAC needed by either pod), but
creating one explicitly is best practice and lets future hooks reference it.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "stjorna.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
{{- with .Values.image.pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
