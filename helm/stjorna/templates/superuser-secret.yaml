{{- /*
Default superuser credentials Secret.

The frontend /setup wizard creates the very first PocketBase superuser via
the `POST /api/stjorna/setup-bootstrap-superuser` route registered by
`pocketbase/pb_hooks/setup.pb.js`. To make that flow usable without
requiring the operator to invent an email + password on the spot, this
Secret holds a random default the wizard pre-fills. The operator can
override it on the wizard form, or supply their own Secret via
`pocketbase.superuser.existingSecret` (see values.yaml).

Pre-install hook so the Secret exists before any other resource that
might reference it. `hook-delete-policy` is intentionally NOT set so the
Secret persists once created (mirroring the pattern in secret.yaml for
PB_SECRET).
*/ -}}
{{- if not .Values.pocketbase.superuser.existingSecret -}}
{{- $emailHost := "stjorna.local" -}}
{{- if and .Values.ingress.enabled (gt (len .Values.ingress.hosts) 0) -}}
{{- $emailHost = (index .Values.ingress.hosts 0).host -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stjorna.pocketbase.superuserSecretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    # NO hook-delete-policy: the Secret must PERSIST after the hook
    # completes so the operator can read it back via `kubectl get secret`
    # (and so the NOTES.txt retrieval command works) for the lifetime of
    # the release.
type: Opaque
stringData:
  PB_SUPERUSER_EMAIL: {{ printf "admin@%s" $emailHost | quote }}
  # randAlphaNum (Helm 3.7+) draws from a CSPRNG. 24 chars => ~143 bits of
  # entropy, comfortably more than PB's own installer URL.
  PB_SUPERUSER_PASSWORD: {{ randAlphaNum 24 | quote }}
{{- end -}}
