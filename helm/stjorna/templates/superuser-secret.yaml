{{- /*
Default superuser credentials Secret.

Mounted into the PocketBase pod as PB_SUPERUSER_EMAIL / PB_SUPERUSER_PASSWORD
(see pocketbase-deployment.yaml). entrypoint.sh creates the first superuser
from these values on the first boot, so the frontend /setup wizard only has
to log in — the unauthenticated bootstrap route registered by
`pocketbase/pb_hooks/setup.pb.js` is never needed on a Helm install (T-04).
The operator can supply their own Secret via
`pocketbase.superuser.existingSecret` (see values.yaml).

T-06.1: this is a NORMAL release resource (not a pre-install hook), exactly
like secret.yaml for PB_SECRET:

  - `lookup` re-uses the existing values on every upgrade / re-install, so
    the password is never silently re-generated. entrypoint.sh only applies
    the credentials on the very first boot (marker file in pb_data); a
    re-generated Secret would drift from the real superuser password and
    NOTES.txt / `kubectl get secret` would print a password that does not
    work.
  - `helm.sh/resource-policy: keep` makes the Secret survive
    `helm uninstall`, matching the PVC and PB_SECRET it belongs to.
*/ -}}
{{- if not .Values.pocketbase.superuser.existingSecret -}}
{{- $secretName := include "stjorna.pocketbase.superuserSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name $secretName -}}
{{- $emailHost := "stjorna.local" -}}
{{- if and .Values.ingress.enabled (gt (len .Values.ingress.hosts) 0) -}}
{{- $emailHost = (index .Values.ingress.hosts 0).host -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- if and $existing (index $existing.data "PB_SUPERUSER_EMAIL") }}
  PB_SUPERUSER_EMAIL: {{ index $existing.data "PB_SUPERUSER_EMAIL" | b64dec | quote }}
  {{- else }}
  PB_SUPERUSER_EMAIL: {{ printf "admin@%s" $emailHost | quote }}
  {{- end }}
  {{- if and $existing (index $existing.data "PB_SUPERUSER_PASSWORD") }}
  PB_SUPERUSER_PASSWORD: {{ index $existing.data "PB_SUPERUSER_PASSWORD" | b64dec | quote }}
  {{- else }}
  # randAlphaNum (Helm 3.7+) draws from a CSPRNG. 24 chars => ~143 bits of
  # entropy, comfortably more than PB's own installer URL.
  PB_SUPERUSER_PASSWORD: {{ randAlphaNum 24 | quote }}
  {{- end -}}
{{- end -}}
