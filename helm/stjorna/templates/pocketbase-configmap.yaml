{{- /*
PocketBase hooks ConfigMap. Renders all *.pb.js files found in
pocketbase/pb_hooks/ as keys in a single ConfigMap.

Gated by pocketbase.hooks.mountFromConfigMap. When false, the user is
expected to have baked the hooks into the PB image.
*/ -}}
{{- if .Values.pocketbase.hooks.mountFromConfigMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stjorna.pocketbase.fullname" . }}-hooks
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
data:
{{- $root := . }}
{{- range $path, $content := (.Files.Glob "files/hooks/*.pb.js") }}
  {{- $base := base $path }}
  {{ $base }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end -}}
