{{- if .Values.pocketbase.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stjorna.pocketbase.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
  annotations:
    # T-06: never let Helm delete this PVC. Without this annotation,
    # `helm uninstall` removes the PVC; with most StorageClasses
    # (reclaimPolicy: Delete) the underlying PV is then deleted too,
    # and all PB data — including the encrypted settings that depend
    # on PB_SECRET — is gone. With `keep`, the PVC and its PV survive
    # uninstall; the operator deletes them by hand when they really
    # want the storage back.
    "helm.sh/resource-policy": keep
spec:
  accessModes:
    {{- toYaml .Values.pocketbase.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.pocketbase.persistence.size | quote }}
  {{- with .Values.pocketbase.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end -}}
{{/*
NOTE: persistentVolumeReclaimPolicy is intentionally NOT set on the PVC.
That field belongs on a PersistentVolume (PV), not a PVC. To get
"retain data on helm uninstall" semantics, configure the StorageClass
with reclaimPolicy: Retain (cluster-side). The chart documents this in
README.md; the values.pocketbase.persistence.reclaimPolicy key is kept
for documentation purposes only.

T-06: the cluster-side reclaim policy covers the *PV* lifecycle
(e.g. PV deleted → volume data gone). The PVC-level
`helm.sh/resource-policy: keep` annotation above covers the *Helm*
lifecycle (helm uninstall leaves the PVC in place, so the underlying
PV is never deleted by Helm either). The two are complementary —
you want both.
*/ -}}
