{{- /*
Auto-generate the PB_SECRET Secret only if the user has NOT supplied an
existing one. The pre-install hook ensures the Secret exists before the PB
Pod tries to read it.
*/ -}}
{{- if not .Values.pocketbase.secret.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stjorna.pocketbase.secretName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    # NOTE: no hook-delete-policy. The Secret must PERSIST after the hook
    # succeeds so the PocketBase pod can read PB_SECRET via env.valueFrom.
type: Opaque
stringData:
  {{- /*
  `randAlphaNum` requires Helm 3.7+ and uses crypto/rand under the hood.
  Length 64 ⇒ 64 chars of CSPRNG alphabet ⇒ ~380 bits of entropy (more than
  enough for PB_SECRET). The same value persists across reinstalls of the
  same release because the hook-delete-policy deletes the Secret on a fresh
  install only when the hook runs.
  */}}
  PB_SECRET: {{ randAlphaNum 64 | quote }}
{{- end -}}
