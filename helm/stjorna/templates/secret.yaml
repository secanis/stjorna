{{- /*
Auto-generate the PB_SECRET Secret unless the operator supplied an
existing one. The Secret is a NORMAL release-managed resource — NOT a
pre-install hook — so that:

  - `helm upgrade` keeps it in the release manifest (T-06).
  - The same value is re-rendered on every upgrade via `lookup`, so
    PB_SECRET is never silently rotated. A rotation would make the
    encrypted `data.db` unreadable on the next pod start.

On a fresh install `lookup` returns nil and we generate a fresh
32-char CSPRNG value. The 32-byte length is what PocketBase expects
for AES-256 encryption of its settings (`PB_SECRET` must be ≥ 30
bytes).
*/ -}}
{{- if not .Values.pocketbase.secret.existingSecret -}}
{{- $secretName := include "stjorna.pocketbase.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Values.namespace.name $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: pocketbase
  annotations:
    # T-06: the Secret must outlive `helm uninstall` so that the next
    # install can still decrypt `data.db`. Without this, an operator
    # who re-installs the chart (or Argo CD's PreSync) gets a fresh
    # PB_SECRET, the pod starts with that, and PB refuses to read the
    # existing settings because AES key is wrong.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  {{- if and $existing (index $existing.data "PB_SECRET") }}
  PB_SECRET: {{ index $existing.data "PB_SECRET" | b64dec | quote }}
  {{- else }}
  PB_SECRET: {{ randAlphaNum 32 | quote }}
  {{- end -}}
{{- end -}}
