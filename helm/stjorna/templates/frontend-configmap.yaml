apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stjorna.frontend.fullname" . }}-nginx
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "stjorna.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |-
    # `map` lives in the http context (this file is included from http{}),
    # outside any server block. Only advertise an upgrade when the client
    # actually asks for one (WebSocket/SSE).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen {{ .Values.frontend.service.port }};
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Backup imports and media uploads can be up to 500 MB (matches the
        # backend MAX_FILE_BYTES / media maxSize); nginx's 1 MB default would
        # otherwise reject them with 413 before they reach PocketBase.
        client_max_body_size 500m;
        # Stream request bodies to PocketBase instead of buffering them to disk
        # first — large uploads/imports otherwise consume the pod's scratch space.
        proxy_request_buffering off;

        # Security headers (T-12). CSP is same-origin only — the SPA, its assets
        # and the PocketBase API are all served through this proxy; swagger-ui
        # needs inline styles and eval, hence the allowances.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

        # Never cache the SPA entrypoint; always cache hashed assets.
        location = /index.html {
            # `expires` (not add_header) keeps the server-level security headers:
            # any add_header in a location drops all inherited add_header lines.
            expires epoch;
        }

        # Runtime config generated at container start from PB_URL
        # (/docker-entrypoint.d/40-stjorna-config.sh). Falls back to the
        # build-time default in the html dir. `expires epoch` (not add_header)
        # so the server-level security headers above are still inherited.
        location = /config.js {
            root /tmp/stjorna;
            expires epoch;
            try_files /config.js @default_config;
        }
        location @default_config {
            expires epoch;
            try_files /config.js =404;
        }

        location /assets/ {
            expires max;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        {{- $pbHost := printf "%s.%s.svc.cluster.local" (include "stjorna.pocketbase.fullname" .) .Values.namespace.name }}
        location /api/ {
            proxy_pass http://{{ $pbHost }}:{{ .Values.pocketbase.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # PocketBase realtime (SSE) — long-lived, unbuffered responses. Buffering
        # on would swallow events and hang until the stream closes.
        location /api/realtime {
            proxy_pass http://{{ $pbHost }}:{{ .Values.pocketbase.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # PocketBase superuser UI + hardcoded OAuth2 redirect success/failure pages
        location /_ {
            proxy_pass http://{{ $pbHost }}:{{ .Values.pocketbase.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    }
