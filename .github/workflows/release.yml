# SPDX-License-Identifier: MIT
# Release for STJÓRNA — runs on push of tags matching v* (e.g. v3.0.0).
#
# Job graph (parallelised where independent):
#
#   build-images
#       │
#       ├──> bootstrap-gh-pages (parallel) ─── creates orphan branch if absent
#       │        │
#       │        └──> release-helm ─── packages chart, updates index.yaml
#       │                  │
#       │                  └──> publish-site ─── reads latest from index.yaml,
#       │                                          substitutes the version into
#       │                                          site/index.html, overlays
#       │                                          site/ on gh-pages, pushes.
#       │                                              │
#       │                                              └──> notify-artifacthub
#
# Why the site lands AFTER the chart:
#   The site has two hardcoded version strings — the `--version X.Y.Z` in the
#   "Install via Helm" snippet and the `stjorna-X.Y.Z.tgz` link. Until now
#   those were committed to source and went stale every release (e.g. rc2
#   shipped but the site kept showing rc1). By publishing the site AFTER
#   chart-releaser writes index.yaml, we can substitute the version from
#   the live index.yaml at deploy time — the site always tracks the latest.
#
# Why chart-releaser can't run before bootstrap:
#   chart-releaser-action refuses to bootstrap the pages branch with the
#   restricted GITHUB_TOKEN on a fresh repo, so a tiny bootstrap step runs
#   first just to create the orphan branch. The bootstrap never touches
#   site/ or the chart — it exists purely to satisfy that requirement.
#
# Required secrets:
#   - DOCKERHUB_USERNAME   Docker Hub username
#   - DOCKERHUB_TOKEN      Docker Hub access token (NOT the account password)
#
# Optional (for manual releases):
#   - workflow_dispatch input `tag` (e.g. v3.0.0) to release without a tag push

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        default: ''

# Don't cancel an in-progress release mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY_PB: docker.io/secanis/stjorna-pocketbase
  REGISTRY_FE: docker.io/secanis/stjorna-frontend

jobs:
  # -------------------------------------------------------------------------
  # 1. Build and push images to Docker Hub (public, for distribution)
  # -------------------------------------------------------------------------
  build-images:
    name: Build and push image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pocketbase
            context: pocketbase
            dockerfile: pocketbase/Dockerfile
            registry: docker.io/secanis/stjorna-pocketbase
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            registry: docker.io/secanis/stjorna-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved. Push a v* tag or pass 'tag' input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ matrix.registry }}
          tags: |
            # The exact tag (e.g. v3.0.0)
            type=raw,value=${{ steps.version.outputs.tag }}
            # Semver expansion: 3.0.0, 3.0, 3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest on main only
            type=raw,value=latest,enable={{is_default_branch}}
          # Avoid double-`v` when semver and raw both produce "v3.0.0"
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}

  # -------------------------------------------------------------------------
  # 2. Bootstrap the gh-pages branch (orphan + empty commit) so that
  # chart-releaser-action has somewhere to push on a fresh repo. Runs in
  # parallel with release-helm's setup; only writes to the branch when it
  # doesn't already exist.
  # -------------------------------------------------------------------------
  bootstrap-gh-pages:
    name: Bootstrap gh-pages branch
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Ensure gh-pages branch exists on origin
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages already exists on origin — nothing to bootstrap"
            exit 0
          fi
          echo "gh-pages missing on origin — bootstrapping with an empty commit"
          # Pattern for modern git (>= 2.30): 'git worktree add' no
          # longer accepts --orphan. The bootstrap is a 3-step dance:
          #   1. add a detached worktree (working tree = current commit)
          #   2. clear the working tree (so the orphan starts empty)
          #   3. switch to the orphan branch and create an empty commit
          git worktree add --detach /tmp/gh-pages-bootstrap
          git -C /tmp/gh-pages-bootstrap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages-bootstrap config user.name  "github-actions[bot]"
          # Clear the working tree: 'git rm -rfq' knows not to touch
          # the .git dir, so the worktree stays valid.
          git -C /tmp/gh-pages-bootstrap rm -rfq .
          # Now create the orphan branch (no files staged or in worktree)
          git -C /tmp/gh-pages-bootstrap checkout --orphan gh-pages
          git -C /tmp/gh-pages-bootstrap commit --allow-empty -m "chore: bootstrap gh-pages for site + chart"
          git -C /tmp/gh-pages-bootstrap push origin gh-pages
          git -C /tmp/gh-pages-bootstrap checkout --detach
          git worktree remove --force /tmp/gh-pages-bootstrap

  # -------------------------------------------------------------------------
  # 3. Package and publish the helm chart
  # Uses chart-releaser-action which:
  #   - packages helm/stjorna/ as a .tgz
  #   - publishes to the gh-pages branch (with index.yaml)
  #   - creates a GitHub release with the chart attached
  # -------------------------------------------------------------------------
  release-helm:
    name: Package and publish helm chart
    needs: [build-images, bootstrap-gh-pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - name: Resolve release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved. Push a v* tag or pass 'tag' input."
            exit 1
          fi
          # Strip the leading v for the chart version (semver)
          CHART_VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
      - name: Update Chart.yaml (version + appVersion)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHART_VERSION="${{ steps.version.outputs.chart_version }}"
          sed -i "s/^version: .*/version: $CHART_VERSION/" helm/stjorna/Chart.yaml
          sed -i "s/^appVersion: \".*\"/appVersion: \"$TAG\"/" helm/stjorna/Chart.yaml
          # Also sync values.yaml so `helm install` (without overrides) pulls
          # the right images for this release.
          sed -i "s|^\(\s*tag:\s*\).*|\1$TAG|" helm/stjorna/values.yaml
          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" helm/stjorna/Chart.yaml
          echo "Updated image tags in values.yaml:"
          grep -E "tag:" helm/stjorna/values.yaml
      - name: Clone garage subchart (required for helm dep build)
        # The Deuxfleurs garage repo doesn't have its Chart.yaml at the
        # repo root — the helm chart lives in script/helm/garage/. Helm's
        # file://../garage dep expects Chart.yaml at helm/garage/, so we
        # clone the repo to a scratch dir and copy the chart contents
        # into helm/garage/ where helm will find them.
        run: |
          SCRATCH="$(mktemp -d)"
          git clone --branch v1.3.1 --depth 1 \
            https://git.deuxfleurs.fr/Deuxfleurs/garage "$SCRATCH/garage"
          mkdir -p "$GITHUB_WORKSPACE/helm/garage"
          # Copy chart contents (Chart.yaml, templates/, values.yaml,
          # .helmignore, etc.) into the path helm expects.
          cp -r "$SCRATCH/garage/script/helm/garage/." \
                "$GITHUB_WORKSPACE/helm/garage/"
          rm -rf "$SCRATCH"
          echo "garage chart staged at $GITHUB_WORKSPACE/helm/garage"
          ls -la "$GITHUB_WORKSPACE/helm/garage"
      - name: Build chart dependencies
        working-directory: helm/stjorna
        run: |
          helm dependency build
          # Verify the dependency was built and vendored.
          ls -la charts/ 2>&1
      - name: Configure git (chart-releaser needs it)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2
      - uses: helm/chart-releaser-action@v1
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: helm
          # NB: skip_packaging is intentionally NOT set. Setting it to
          # the literal "false" is treated as truthy by the action's
          # bash -n check (any non-empty string passes), which makes
          # cr.sh skip the packaging step entirely and fail with
          # "no charts found at .cr-release-packages". Omitting the
          # input lets cr.sh run its own helm package step.
          # Mark this release as the latest
          mark_as_latest: true
          # Push the chart + index.yaml to the gh-pages branch
          pages_branch: gh-pages
          # Skip upload if a release for this version already exists
          skip_existing: true

  # -------------------------------------------------------------------------
  # 4. Publish the static site (landing + Swagger UI) to gh-pages.
  # Runs AFTER release-helm so the just-written index.yaml carries the
  # latest chart version. We parse the chart version out of index.yaml
  # (with python+PyYAML, which is on every GHA runner) and substitute it
  # into the two hardcoded spots in site/index.html before pushing.
  # Also refreshes openapi.json from a live PB container so the docs
  # always match the released image.
  # -------------------------------------------------------------------------
  publish-site:
    name: Build & push site to gh-pages
    needs: release-helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve release tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Refresh openapi.json from a live PB container
        # Boots the just-built PB image, fetches the public /api/openapi.json
        # (no auth required per pocketbase/pb_hooks/openapi.pb.js), kills the
        # container. ~10s added to the release.
        #
        # Why --tmpfs instead of a named volume: GHA's Docker named
        # volumes are root-owned. The container's pocketbase user (uid
        # 1000) can't write to a root-owned mount, so PB exits immediately
        # with a permission error and --rm removes the container. A
        # --tmpfs is owned by root but writable by any uid inside the
        # container. We don't need persistence here (we just want the
        # spec out), so --tmpfs is the right tool.
        #
        # Also: the health check and spec fetch go via 'docker exec' so
        # we curl from inside the container using its own loopback,
        # avoiding any --network=host quirks on the GHA runner.
        env:
          PB_IMAGE: ${{ env.REGISTRY_PB }}
        run: |
          set -e
          # Capture logs on failure for debugging.
          trap 'echo "----- PB container logs -----"; docker logs stjorna-pb-spec 2>&1 || true; docker stop stjorna-pb-spec 2>/dev/null || true' ERR

          docker run -d --rm --network=host --name stjorna-pb-spec \
            --tmpfs /app/pb_data:rw,size=64m \
            "${PB_IMAGE}:${{ steps.version.outputs.tag }}"

          # Wait for PB to be ready. PB usually takes <2s; we allow 60s.
          # NOTE: the PB image is alpine + wget (no curl). Use wget -qO- for
          # the health check and the spec fetch. (-qO- writes the body
          # to stdout, matching what 'curl -fsS' would do, and -q
          # silences progress; --tries=1 --timeout=2 keeps each probe fast.)
          for i in $(seq 1 60); do
            if docker exec stjorna-pb-spec \
                wget -qO- --tries=1 --timeout=2 http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              echo "PB ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Final check — if not ready, dump logs and fail loudly.
          if ! docker exec stjorna-pb-spec \
              wget -qO- --tries=1 --timeout=2 http://127.0.0.1:8090/api/health >/dev/null; then
            echo "PB did not become ready within 60s"
            echo "----- PB container logs -----"
            docker logs stjorna-pb-spec 2>&1
            exit 1
          fi

          # Fetch the spec from inside the container.
          docker exec stjorna-pb-spec \
            wget -qO /tmp/openapi.json --tries=1 --timeout=5 http://127.0.0.1:8090/api/openapi.json
          docker cp stjorna-pb-spec:/tmp/openapi.json site/openapi.json
          docker stop stjorna-pb-spec
          echo "Refreshed openapi.json: $(wc -c < site/openapi.json) bytes"
      - name: Inject latest chart version into site/index.html
        # chart-releaser just wrote index.yaml on gh-pages. Read the latest
        # version from it and substitute the two hardcoded version strings
        # in the site:
        #   - line 94: `helm install ... --version 3.0.0-rc1`
        #   - line 114: `<a href="stjorna-3.0.0-rc1.tgz">`
        # If substitution fails (e.g. no entries yet — first release), the
        # site keeps whatever's in the source tree, which is harmless.
        run: |
          git fetch origin gh-pages
          LATEST="$(git show origin/gh-pages:index.yaml \
              | python3 -c 'import sys,yaml; d=yaml.safe_load(sys.stdin); print(d["entries"]["stjorna"][0]["version"])' \
              || true)"
          if [ -z "$LATEST" ]; then
            echo "::warning::Could not resolve latest chart version from index.yaml — leaving site/index.html untouched."
            exit 0
          fi
          echo "Latest chart version: $LATEST"
          # Substitute both hardcoded spots. Pattern matches semver+prerelease
          # (e.g. 3.0.0, 3.0.0-rc1). The trailing 'g' is not strictly needed
          # but makes the regex unambiguous on multi-digit versions.
          sed -i -E "s|(--version )[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|\1$LATEST|g" site/index.html
          sed -i -E "s|(stjorna-)[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\.tgz)|\1$LATEST\3|g" site/index.html
          echo "Patched site/index.html — relevant lines:"
          grep -n -E "(stjorna-)|--version" site/index.html
      - name: Push site to gh-pages
        # Overlay site/ on the existing branch, EXCLUDING chart artifacts
        # so this job never clobbers index.yaml or *.tgz that release-helm
        # wrote.
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git worktree add /tmp/gh-pages-site gh-pages
          rsync -a --delete \
                --exclude '.git' \
                --exclude 'index.yaml' \
                --exclude '*.tgz' \
                --filter='P CNAME' \
                site/ /tmp/gh-pages-site/
          cd /tmp/gh-pages-site
          # Use -f to force-add openapi.json despite the .gitignore rule
          # in site/.gitignore. The rule exists for the main branch (we
          # don't want a stale generated spec in the repo), but the spec
          # MUST ship on gh-pages so Swagger UI at /docs/ can fetch it.
          git add -Af .
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish site to gh-pages"
            git push origin gh-pages
          else
            echo "No site changes to commit"
          fi
          git worktree remove --force /tmp/gh-pages-site

  # -------------------------------------------------------------------------
  # 5. Notify artifacthub.io (optional, but recommended)
  # Artifact Hub auto-crawls Helm repos on a schedule, so this is just a
  # nudge to re-index the chart immediately after publishing.
  # -------------------------------------------------------------------------
  notify-artifacthub:
    name: Trigger Artifact Hub re-index (optional)
    runs-on: ubuntu-latest
    needs: publish-site
    if: success()
    continue-on-error: true   # don't fail the release if AH is unreachable
    steps:
      - name: Ping Artifact Hub
        run: |
          # Replace with the actual Helm repo URL once configured on AH
          REPO="https://secanis.github.io/stjorna/"
          echo "Notifying Artifact Hub to re-index $REPO"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            "https://artifacthub.io/api/v1/repositories/reindex" \
            -d "{\"url\":\"$REPO\"}" || true
