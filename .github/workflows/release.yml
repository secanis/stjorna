# SPDX-License-Identifier: AGPL-3.0-or-later
# Release for STJÓRNA — runs on push of tags matching v* (e.g. v3.0.0).
#
# Job graph (parallelised where independent):
#
#   resolve ─── validates the tag (push or workflow_dispatch input)
#       │
#   test ─── the full CI suite (ci.yml via workflow_call) at that tag
#       │
#   build-images ─── multi-arch (linux/amd64 + linux/arm64)
#       │
#       ├──> bootstrap-gh-pages (parallel) ─── creates orphan branch if absent
#       │        │
#       │        └──> release-helm ─── packages chart, updates index.yaml
#       │                  │
#       │                  └──> publish-site ─── builds the Astro/Starlight site
#       │                                          (npm ci + astro build), then
#       │                                          substitutes the version into
#       │                                          site/dist/index.html, overlays
#       │                                          site/dist/ on gh-pages, pushes.
#       │                                              │
#       │                                              └──> notify-artifacthub
#
# Why the site lands AFTER the chart:
#   The site's "Install via Helm" snippet has a hardcoded version string. The
#   source (site/src/pages/index.astro) uses a `@@CHART_VERSION@@` placeholder,
#   and the publish-site job substitutes it with the chart version derived from
#   the release tag after building. This avoids shipping a stale version to
#   consumers and removes the brittle regex-based parse of the live index.yaml.
#
# Why the gh-pages bootstrap still runs first:
#   Both release-helm (index.yaml) and publish-site (site/) push to gh-pages
#   via `git worktree add -B gh-pages ... origin/gh-pages`, which requires the
#   branch to already exist on origin. The bootstrap creates the orphan branch
#   on a fresh repo and never touches site/ or the chart.
#
# Required secrets:
#   - DOCKERHUB_USERNAME   Docker Hub username
#   - DOCKERHUB_TOKEN      Docker Hub access token (NOT the account password)
#
# Optional (for manual releases):
#   - workflow_dispatch input `tag` (e.g. v3.0.0) to (re-)release an EXISTING
#     tag without a tag push. Every job checks out that tag, not the branch
#     the dispatch was started from.
#
# Security: inputs / event data never appear inside `run:` scripts as
# ${{ }} expressions (script injection); they are passed via `env:` and
# the tag is validated against a strict semver pattern in `resolve`.
# Actions are pinned to commit SHAs (version in the trailing comment).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true
        default: ''

# Don't cancel an in-progress release mid-flight
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: read-only by default, write only on the jobs that push
# to the gh-pages branch / create the chart release. Docker Hub uses its
# own token, gh-pages is pushed with git (no Pages / OIDC API), so
# packages / pages / id-token write are not needed anywhere.
permissions:
  contents: read

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  REGISTRY_PB: docker.io/secanis/stjorna-pocketbase
  REGISTRY_FE: docker.io/secanis/stjorna-frontend

jobs:
  # -------------------------------------------------------------------------
  # 0. Resolve + validate the release tag once; every other job uses the
  # outputs (never ${{ inputs.tag }} directly).
  # -------------------------------------------------------------------------
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Resolve release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved. Push a v* tag or pass 'tag' input."
            exit 1
          fi
          # Strict semver (with optional pre-release) — also guarantees the
          # value is safe to use in sed / shell / image tags downstream.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not a valid release tag (expected vX.Y.Z or vX.Y.Z-pre)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip the leading v for the chart version (semver)
          echo "chart_version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 0b. Full test suite at the release tag. Nothing is published unless it
  # passes (test-e2e is still continue-on-error inside ci.yml, see T-15).
  # -------------------------------------------------------------------------
  test:
    name: Test
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}

  # -------------------------------------------------------------------------
  # 1. Build and push multi-arch images to Docker Hub (public, for distribution)
  # -------------------------------------------------------------------------
  build-images:
    name: Build and push image (${{ matrix.name }})
    needs: [resolve, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pocketbase
            context: pocketbase
            dockerfile: pocketbase/Dockerfile
            registry: docker.io/secanis/stjorna-pocketbase
            repo: secanis/stjorna-pocketbase
            readme: docker/pocketbase.md
            short_description: STJÓRNA backend — PocketBase v0.40 with STJÓRNA hooks, migrations and OpenAPI pre-installed.
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            registry: docker.io/secanis/stjorna-frontend
            repo: secanis/stjorna-frontend
            readme: docker/frontend.md
            short_description: STJÓRNA frontend — SolidJS SPA served by nginx-unprivileged, pairs with stjorna-pocketbase.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      # QEMU for the linux/arm64 leg of the multi-arch build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ matrix.registry }}
          tags: |
            # The exact tag (e.g. v3.0.0)
            type=raw,value=${{ needs.resolve.outputs.tag }}
            # Semver expansion: 3.0.0, 3.0, 3 (value= needed for
            # workflow_dispatch, where github.ref is a branch)
            type=semver,pattern={{version}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.tag }}
            # latest on main only
            type=raw,value=latest,enable={{is_default_branch}}
          # Avoid double-`v` when semver and raw both produce "v3.0.0"
          flavor: latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          # Stamp the release tag into both images: the frontend's
          # public/version.json and PocketBase's STJORNA_VERSION env (the
          # OpenAPI info.version). STJORNA_COMMIT is frontend only.
          # Done conditionally here rather than via the matrix
          # include because actionlint forbids ${{ steps.* }} inside
          # matrix entries (matrix is built before steps run).
          build-args: |
            STJORNA_VERSION=${{ needs.resolve.outputs.tag }}
            ${{ matrix.name == 'frontend' && format('STJORNA_COMMIT={0}', github.sha) || '' }}
      # Sync the Docker Hub repo description + full README from
      # docker/<name>.md so the published image page documents itself.
      # Runs after the image push so the page only updates when the
      # push actually succeeded. Failures here do not roll back the
      # image — log them and continue.
      - name: Sync Docker Hub description
        if: success()
        continue-on-error: true
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.repo }}
          readme-filepath: ${{ matrix.readme }}
          short-description: ${{ matrix.short_description }}

  # -------------------------------------------------------------------------
  # 2. Bootstrap the gh-pages branch (orphan + empty commit) so that the
  # index.yaml / site push steps have somewhere to push on a fresh repo. Runs
  # in parallel with release-helm's setup; only writes to the branch when it
  # doesn't already exist.
  # -------------------------------------------------------------------------
  bootstrap-gh-pages:
    name: Bootstrap gh-pages branch
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Ensure gh-pages branch exists on origin
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages already exists on origin — nothing to bootstrap"
            exit 0
          fi
          echo "gh-pages missing on origin — bootstrapping with an empty commit"
          # Pattern for modern git (>= 2.30): 'git worktree add' no
          # longer accepts --orphan. The bootstrap is a 3-step dance:
          #   1. add a detached worktree (working tree = current commit)
          #   2. clear the working tree (so the orphan starts empty)
          #   3. switch to the orphan branch and create an empty commit
          git worktree add --detach /tmp/gh-pages-bootstrap
          git -C /tmp/gh-pages-bootstrap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gh-pages-bootstrap config user.name  "github-actions[bot]"
          # Clear the working tree: 'git rm -rfq' knows not to touch
          # the .git dir, so the worktree stays valid.
          git -C /tmp/gh-pages-bootstrap rm -rfq .
          # Now create the orphan branch (no files staged or in worktree)
          git -C /tmp/gh-pages-bootstrap checkout --orphan gh-pages
          git -C /tmp/gh-pages-bootstrap commit --allow-empty -m "chore: bootstrap gh-pages for site + chart"
          git -C /tmp/gh-pages-bootstrap push origin gh-pages
          git -C /tmp/gh-pages-bootstrap checkout --detach
          git worktree remove --force /tmp/gh-pages-bootstrap

  # -------------------------------------------------------------------------
  # 3. Package and publish the helm chart
  # Packages helm/stjorna/ as a .tgz and attaches it to the release the tag
  # points at (e.g. v3.0.0-rc14) — NOT a second, auto-created `stjorna-X.Y.Z`
  # release. Then regenerates index.yaml on gh-pages so `helm install` finds
  # the chart.
  # -------------------------------------------------------------------------
  release-helm:
    name: Package and publish helm chart
    needs: [resolve, build-images, bootstrap-gh-pages]
    runs-on: ubuntu-latest
    permissions:
      # Uploads the .tgz to the existing release and pushes index.yaml to
      # gh-pages.
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.2
      - name: Update Chart.yaml (version + appVersion)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          sed -i "s/^version: .*/version: $CHART_VERSION/" helm/stjorna/Chart.yaml
          sed -i "s/^appVersion: \".*\"/appVersion: \"$TAG\"/" helm/stjorna/Chart.yaml
          # Also sync values.yaml so `helm install` (without overrides) pulls
          # the right images for this release.
          sed -i "s|^\(\s*tag:\s*\).*|\1$TAG|" helm/stjorna/values.yaml
          echo "Updated Chart.yaml:"
          grep -E "^(version|appVersion):" helm/stjorna/Chart.yaml
          echo "Updated image tags in values.yaml:"
          grep -E "tag:" helm/stjorna/values.yaml
      - name: Clone garage subchart (required for helm dep build)
        # The Deuxfleurs garage repo doesn't have its Chart.yaml at the
        # repo root — the helm chart lives in script/helm/garage/. Helm's
        # file://../garage dep expects Chart.yaml at helm/garage/, so we
        # clone the repo to a scratch dir and copy the chart contents
        # into helm/garage/ where helm will find them.
        run: |
          SCRATCH="$(mktemp -d)"
          git clone --branch v1.3.1 --depth 1 \
            https://git.deuxfleurs.fr/Deuxfleurs/garage "$SCRATCH/garage"
          mkdir -p "$GITHUB_WORKSPACE/helm/garage"
          # Copy chart contents (Chart.yaml, templates/, values.yaml,
          # .helmignore, etc.) into the path helm expects.
          cp -r "$SCRATCH/garage/script/helm/garage/." \
                "$GITHUB_WORKSPACE/helm/garage/"
          rm -rf "$SCRATCH"
          echo "garage chart staged at $GITHUB_WORKSPACE/helm/garage"
          ls -la "$GITHUB_WORKSPACE/helm/garage"
      - name: Build chart dependencies
        working-directory: helm/stjorna
        run: |
          helm dependency build
          # Verify the dependency was built and vendored.
          ls -la charts/ 2>&1
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      # Package the chart ourselves (instead of chart-releaser-action) so the
      # .tgz lands on the SAME release the tag points at (e.g. v3.0.0-rc14),
      # not a second, auto-created `stjorna-X.Y.Z` release.
      - name: Package chart
        env:
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          mkdir -p .cr-release-packages
          helm package helm/stjorna --destination .cr-release-packages
          ls -la .cr-release-packages
          test -f ".cr-release-packages/stjorna-${CHART_VERSION}.tgz"
      # Attach the packaged chart to the release that triggered this run. If
      # the release does not exist yet (a bare tag push without a release),
      # create it first; `--clobber` makes re-runs idempotent.
      - name: Attach chart package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          TGZ=".cr-release-packages/stjorna-${CHART_VERSION}.tgz"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet — creating it"
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "$TGZ" --clobber
          echo "Uploaded $TGZ to release $TAG"
      # Regenerate index.yaml on gh-pages. Only the NEW chart is indexed (in an
      # isolated dir) so `helm repo index --merge` adds/updates just that entry
      # and leaves every previously released chart's URL untouched.
      - name: Update Helm index on gh-pages
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p /tmp/newchart
          cp ".cr-release-packages/stjorna-${CHART_VERSION}.tgz" /tmp/newchart/
          git worktree add -B gh-pages /tmp/gh-pages-index origin/gh-pages
          helm repo index /tmp/newchart --url "$REPO_URL" --merge /tmp/gh-pages-index/index.yaml
          cp /tmp/newchart/index.yaml /tmp/gh-pages-index/index.yaml
          cd /tmp/gh-pages-index
          if ! git diff --quiet index.yaml; then
            git add index.yaml
            git commit -m "ci: publish chart $CHART_VERSION (release $TAG)"
            git push origin gh-pages
          else
            echo "index.yaml unchanged"
          fi
          git worktree remove --force /tmp/gh-pages-index

  # -------------------------------------------------------------------------
  # 4. Publish the static site (landing + Swagger UI) to gh-pages.
  # Runs AFTER release-helm so the chart is already published. The chart
  # version is taken from the release tag output, and the `@@CHART_VERSION@@`
  # placeholders in site/index.html are substituted before pushing.
  # Also refreshes openapi.json from a live PB container so the docs
  # always match the released image.
  # -------------------------------------------------------------------------
  publish-site:
    name: Build & push site to gh-pages
    needs: [resolve, release-helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        run: npm ci
        working-directory: site
      - name: Build site (Astro + Starlight)
        run: npm run build
        working-directory: site
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Refresh openapi.json from a live PB container
        # Boots the just-built PB image, fetches the public /api/openapi.json
        # (no auth required per pocketbase/pb_hooks/openapi.pb.js), kills the
        # container. ~10s added to the release.
        #
        # Bootstrap env vars mirror frontend/tests/e2e/helpers/global-setup.ts.
        # PB v0.40 requires the first superuser to be created non-interactively
        # before it will serve /api/health and /api/openapi.json reliably;
        # without these vars PB can stall in installer mode and the wait loop
        # never sees a healthy port.
        #
        # Why --tmpfs instead of a named volume: GHA's Docker named
        # volumes are root-owned. The container's pocketbase user (uid
        # 1000) can't write to a root-owned mount, so PB exits immediately
        # with a permission error and --rm removes the container. A
        # --tmpfs avoids persistence, but its default mode is 0755 root
        # (still not writable by uid 1000 — that's the "unable to open
        # database file (14)" failure), so we set mode=1777 explicitly.
        # We don't need persistence here (we just want the spec out).
        #
        # No --rm: if PB exits during boot we want `docker logs` to still
        # work. We capture the container ID from `docker run` and use it
        # for every subsequent command, so a name collision can't bite us.
        #
        # Also: the health check and spec fetch go via 'docker exec' so
        # we curl from inside the container using its own loopback,
        # avoiding any --network=host quirks on the GHA runner.
        env:
          PB_IMAGE: ${{ env.REGISTRY_PB }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -e
          CONTAINER_ID="$(docker run -d --network=host \
            --tmpfs /app/pb_data:rw,size=64m,mode=1777 \
            -e PB_SUPERUSER_EMAIL=release-bot@stjorna.local \
            -e PB_SUPERUSER_PASSWORD=release-bot-password \
            -e STJORNA_SETUP_TOKEN=release-bot-setup-token \
            -e PB_SECRET=0123456789abcdef0123456789abcdef \
            "${PB_IMAGE}:${TAG}")"
          echo "PB container: ${CONTAINER_ID}"

          # Always clean up — even on failure.
          cleanup() {
            docker logs "${CONTAINER_ID}" 2>&1 || true
            docker rm -f "${CONTAINER_ID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Wait for PB: health endpoint AND a real schema managed by the
          # production migrations (mirrors frontend/tests/e2e/helpers/global-setup.ts).
          # Fail fast when the container exits instead of polling a dead port.
          for i in $(seq 1 60); do
            RUNNING="$(docker inspect --format '{{.State.Running}}' "${CONTAINER_ID}" 2>/dev/null || echo false)"
            if [ "${RUNNING}" != "true" ]; then
              echo "PB container exited after ${i}s"
              cleanup
              exit 1
            fi
            if docker exec "${CONTAINER_ID}" \
                wget -qO- --tries=1 --timeout=2 http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              echo "PB ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Final check — if not ready, dump logs and fail loudly.
          if ! docker exec "${CONTAINER_ID}" \
              wget -qO- --tries=1 --timeout=2 http://127.0.0.1:8090/api/health >/dev/null; then
            echo "PB did not become ready within 60s"
            cleanup
            exit 1
          fi

          # Fetch the spec from inside the container.
          docker exec "${CONTAINER_ID}" \
            wget -qO /tmp/openapi.json --tries=1 --timeout=5 http://127.0.0.1:8090/api/openapi.json
          docker cp "${CONTAINER_ID}":/tmp/openapi.json site/dist/openapi.json
          echo "Refreshed openapi.json: $(wc -c < site/dist/openapi.json) bytes"
      - name: Inject latest chart version into site/dist/index.html
        # The built landing page (site/dist/index.html) uses a
        # @@CHART_VERSION@@ placeholder (semver, e.g. 3.0.0-rc3) in the
        # "Install via Helm" snippet. Substituting here is more reliable than
        # parsing the just-updated index.yaml, which may not be visible yet.
        env:
          CHART_VERSION: ${{ needs.resolve.outputs.chart_version }}
        run: |
          if [ -z "$CHART_VERSION" ]; then
            echo "::error::Could not resolve chart version from release tag."
            exit 1
          fi
          echo "Injecting chart version: $CHART_VERSION"
          echo "Before sed:"
          grep -n -E "(stjorna-)|--version" site/dist/index.html || true
          sed -i "s|@@CHART_VERSION@@|$CHART_VERSION|g" site/dist/index.html
          echo "After sed:"
          grep -n -E "(stjorna-)|--version" site/dist/index.html
          if grep -qE '@@CHART_VERSION@@' site/dist/index.html; then
            echo "::error::site/dist/index.html still contains an unreplaced placeholder"
            exit 1
          fi
      - name: Push site to gh-pages
        # Overlay the built site (site/dist/) on the existing branch, EXCLUDING
        # chart artifacts so this job never clobbers index.yaml or *.tgz that
        # release-helm wrote.
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          # Create a worktree with a local gh-pages branch tracking origin/gh-pages.
          # A detached worktree (the old default) causes 'git push origin gh-pages'
          # to fail because the local branch ref does not exist.
          git worktree add -B gh-pages /tmp/gh-pages-site origin/gh-pages
          echo "Worktree HEAD:"
          git -C /tmp/gh-pages-site log -1 --oneline
          echo "Before rsync — gh-pages index.html:"
          grep -n -E "(stjorna-)|--version" /tmp/gh-pages-site/index.html || true
          rsync -a --delete \
                --exclude '.git' \
                --exclude 'index.yaml' \
                --exclude '*.tgz' \
                --filter='P CNAME' \
                site/dist/ /tmp/gh-pages-site/
          # Belt-and-suspenders: rsync should have copied the patched files,
          # but explicitly copy the two generated files so a future rsync
          # quirk cannot leave stale versions on gh-pages.
          cp -v site/dist/index.html /tmp/gh-pages-site/index.html
          cp -v site/dist/openapi.json /tmp/gh-pages-site/openapi.json
          # Artifact Hub reads artifacthub-repo.yaml from the Helm repo
          # root (ownership verification / repo metadata).
          cp -v artifacthub-repo.yaml /tmp/gh-pages-site/artifacthub-repo.yaml
          echo "After copy — gh-pages index.html:"
          grep -n -E "(stjorna-)|--version" /tmp/gh-pages-site/index.html
          cd /tmp/gh-pages-site
          # Use -f to force-add openapi.json despite the .gitignore rule
          # in site/.gitignore. The rule exists for the main branch (we
          # don't want a stale generated spec in the repo), but the spec
          # MUST ship on gh-pages so Swagger UI at /api/ can fetch it.
          git add -Af .
          if ! git diff --cached --quiet; then
            git commit -m "ci: publish site to gh-pages"
            git push origin gh-pages
          else
            echo "::error::No site changes to commit after patching site/dist/index.html — this should not happen"
            exit 1
          fi
          git worktree remove --force /tmp/gh-pages-site

  # -------------------------------------------------------------------------
  # 5. Notify artifacthub.io (optional, but recommended)
  # Artifact Hub auto-crawls Helm repos on a schedule, so this is just a
  # nudge to re-index the chart immediately after publishing.
  # -------------------------------------------------------------------------
  notify-artifacthub:
    name: Trigger Artifact Hub re-index (optional)
    runs-on: ubuntu-latest
    needs: publish-site
    if: success()
    continue-on-error: true   # don't fail the release if AH is unreachable
    permissions: {}
    steps:
      - name: Ping Artifact Hub
        run: |
          # Replace with the actual Helm repo URL once configured on AH
          REPO="https://secanis.github.io/stjorna/"
          echo "Notifying Artifact Hub to re-index $REPO"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            "https://artifacthub.io/api/v1/repositories/reindex" \
            -d "{\"url\":\"$REPO\"}" || true
